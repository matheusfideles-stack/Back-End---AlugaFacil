<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dados do Inquilino | AlugaFácil</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body data-pagina="inquilino">
    <header class="topo">
        <div class="topo-int largo">
            <a class="logo" href="proprietario.html">Aluga<span>Fácil</span></a>
            <a class="info" href="proprietario.html" style="text-decoration:underline">Bem-vindo, Proprietário!</a>
        </div>
    </header>
    <div class="painel">
        <aside class="lateral">
            <p>Menu</p>
            <nav><a href="proprietario.html">Visão Geral</a><a href="meus-imoveis.html">Meus Imóveis</a><a
                    href="financeiro.html">Financeiro</a><a href="inquilinos.html" class="ativo">Inquilinos</a><a
                    href="proprietario-ajuda.html">Ajuda</a><a href="sair.html">Sair</a></nav>
        </aside>
        <main class="conteudo">
            <div class="cabeca">
                <div class="stat" style="justify-content:flex-start;gap:14px">
                    <div class="avatar" data-campo="iniciais"></div>
                    <h1 class="titulo" data-campo="nome"></h1><span class="selo" data-campo="situacao" data-selo="sim"
                        style="margin:0"></span>
                </div>
                <div class="acoes" style="margin:0"><a class="btn" href="inquilinos.html">Voltar</a><a
                        class="btn btn-ouro" href="#" data-link="editar-inquilino.html?id={id}">Editar</a></div>
            </div>
            <section class="cartao">
                <h2 class="secao" style="margin-top:0">Dados pessoais</h2>
                <div class="linha"><span class="info">CPF</span><strong data-campo="cpf"></strong></div>
                <div class="linha"><span class="info">Data de nascimento</span><strong data-campo="nascimento"
                        data-formato="data"></strong></div>
                <div class="linha"><span class="info">Email</span><strong data-campo="email"></strong></div>
                <div class="linha"><span class="info">Telefone</span><strong data-campo="telefone"></strong></div>
                <div class="linha"><span class="info">Profissão</span><strong data-campo="profissao"></strong></div>
                <div class="linha"><span class="info">Endereço</span><strong data-campo="endereco"></strong></div>
            </section>
            <section class="cartao" style="margin-top:20px">
                <h2 class="secao" style="margin-top:0">Imóvel alugado</h2>
                <div class="linha"><span class="info">Imóvel</span><strong data-campo="imovelNome"></strong></div>
                <div class="linha"><span class="info">Endereço</span><strong data-campo="imovelEndereco"></strong></div>
                <div class="linha"><span class="info">Valor do aluguel</span><strong data-campo="imovelValor"
                        data-formato="dinheiro"></strong></div>
                <div class="linha"><span class="info">Inquilino desde</span><strong data-campo="desde"></strong></div>
                <div class="acoes"><a class="btn" href="#" data-link="imovel.html?id={imovel}" data-exige="imovel">Ver
                        imóvel</a></div>
            </section>
        </main>
    </div>
    <script src="proprietario.js"></script>
</body>

</html>
