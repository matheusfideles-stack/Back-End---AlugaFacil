<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhes do Imóvel | AlugaFácil</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body data-pagina="imovel">
    <header class="topo">
        <div class="topo-int largo">
            <a class="logo" href="proprietario.html">Aluga<span>Fácil</span></a>
            <a class="info" href="proprietario.html" style="text-decoration:underline">Bem-vindo, Proprietário!</a>
        </div>
    </header>
    <div class="painel">
        <aside class="lateral">
            <p>Menu</p>
            <nav><a href="proprietario.html">Visão Geral</a><a href="meus-imoveis.html" class="ativo">Meus Imóveis</a><a
                    href="financeiro.html">Financeiro</a><a href="inquilinos.html">Inquilinos</a><a
                    href="ajuda.html">Ajuda</a><a href="sair.html">Sair</a></nav>
        </aside>
        <main class="conteudo">
            <div class="cabeca">
                <h1 class="titulo" data-campo="nome"></h1>
                <div class="acoes" style="margin:0"><a class="btn" href="meus-imoveis.html">Voltar</a><a
                        class="btn btn-ouro" href="#" data-link="editar-imovel.html?id={id}">Editar</a></div>
            </div>
            <section class="grade g2">
                <div class="foto" style="min-height:260px;border-radius:10px"></div>
                <div class="cartao">
                    <span class="selo" data-campo="status" data-selo="sim"></span>
                    <p class="preco" style="font-size:1.6rem"><span data-campo="valor"
                            data-formato="dinheiro"></span>/mês</p>
                    <div class="linha"><span class="info">Tipo</span><strong data-campo="tipo"></strong></div>
                    <div class="linha"><span class="info">Quartos</span><strong data-campo="quartos"></strong></div>
                    <div class="linha"><span class="info">Banheiros</span><strong data-campo="banheiros"></strong></div>
                    <div class="linha"><span class="info">Área (m²)</span><strong data-campo="area"></strong></div>
                    <div class="linha"><span class="info">Vagas</span><strong data-campo="vagas"></strong></div>
                </div>
            </section>
            <section class="cartao" style="margin-top:20px">
                <h2 class="secao" style="margin-top:0">Localização</h2>
                <div class="linha"><span class="info">Endereço</span><strong data-campo="endereco"></strong></div>
                <div class="linha"><span class="info">Bairro</span><strong data-campo="bairro"></strong></div>
                <div class="linha"><span class="info">Cidade</span><strong data-campo="cidade"></strong></div>
                <h2 class="secao">Descrição</h2>
                <p data-campo="descricao"></p>
            </section>
            <section class="cartao" style="margin-top:20px">
                <h2 class="secao" style="margin-top:0">Inquilino atual</h2>
                <div class="linha" style="border-top:0"><strong data-campo="inquilinoNome"></strong><a class="btn"
                        href="#" data-link="inquilino.html?id={inquilino}" data-exige="inquilino">Ver inquilino</a>
                </div>
            </section>
        </main>
    </div>
    <script src="proprietario.js"></script>
</body>

</html>
