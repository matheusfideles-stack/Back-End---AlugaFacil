<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Imóvel | AlugaFácil</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body data-pagina="imovel-form">
    <header class="topo">
        <div class="topo-int largo">
            <a class="logo" href="proprietario.html">Aluga<span>Fácil</span></a>
            <a class="info" href="proprietario.html" style="text-decoration:underline">Bem-vindo, Proprietário!</a>
        </div>
    </header>
    <div class="painel">
        <aside class="lateral">
            <p>Menu</p>
            <nav><a href="proprietario.html">Visão Geral</a><a href="meus-imoveis.html" class="ativo">Meus Imóveis</a><a
                    href="financeiro.html">Financeiro</a><a href="inquilinos.html">Inquilinos</a><a
                    href="ajuda.html">Ajuda</a><a href="sair.html">Sair</a></nav>
        </aside>
        <main class="conteudo">
            <div class="cabeca">
                <h1 class="titulo">Editar Imóvel</h1>
            </div>
            <form class="cartao">
                <div class="campos">
                    <div class="cheio"><label for="nome">Título do anúncio</label><input id="nome" name="nome"
                            type="text" placeholder="Ex.: Casa - Bairro Alvorada" required></div>
                    <div><label for="tipo">Tipo de imóvel</label><select id="tipo" name="tipo">
                            <option>Casa</option>
                            <option>Apartamento</option>
                            <option>Studio</option>
                        </select></div>
                    <div><label for="status">Status</label><select id="status" name="status">
                            <option>Disponível</option>
                            <option>Alugado</option>
                        </select></div>
                    <div><label for="valor">Valor do aluguel (R$)</label><input id="valor" name="valor" type="number"
                            min="0" step="50" required></div>
                    <div><label for="vagas">Vagas de garagem</label><input id="vagas" name="vagas" type="number"
                            min="0"></div>
                    <div class="cheio"><label for="endereco">Endereço</label><input id="endereco" name="endereco"
                            type="text" placeholder="Rua, número" required></div>
                    <div><label for="bairro">Bairro</label><input id="bairro" name="bairro" type="text" required></div>
                    <div><label for="cidade">Cidade</label><input id="cidade" name="cidade" type="text"
                            placeholder="Patos de Minas" required></div>
                    <div><label for="quartos">Quartos</label><input id="quartos" name="quartos" type="number" min="0"
                            required></div>
                    <div><label for="banheiros">Banheiros</label><input id="banheiros" name="banheiros" type="number"
                            min="0" required></div>
                    <div class="cheio"><label for="area">Área (m²)</label><input id="area" name="area" type="number"
                            min="0" required></div>
                    <div class="cheio"><label for="descricao">Descrição</label><textarea id="descricao" name="descricao"
                            rows="4"></textarea></div>
                    <div class="cheio"><label for="fotos">Fotos</label><input id="fotos" type="file" accept="image/*"
                            multiple></div>
                </div>
                <div class="acoes" style="justify-content:flex-end;margin-top:20px"><a class="btn"
                        href="meus-imoveis.html">Cancelar</a><button class="btn btn-ouro" type="submit">Salvar</button>
                </div>
            </form>
        </main>
    </div>
    <script src="proprietario.js"></script>
</body>

</html>
