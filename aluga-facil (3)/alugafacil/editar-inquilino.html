<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Inquilino | AlugaFácil</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body data-pagina="inquilino-form">
    <header class="topo">
        <div class="topo-int largo">
            <a class="logo" href="proprietario.html">Aluga<span>Fácil</span></a>
            <a class="info" href="proprietario.html" style="text-decoration:underline">Bem-vindo, Proprietário!</a>
        </div>
    </header>
    <div class="painel">
        <aside class="lateral">
            <p>Menu</p>
            <nav><a href="proprietario.html">Visão Geral</a><a href="meus-imoveis.html">Meus Imóveis</a><a
                    href="financeiro.html">Financeiro</a><a href="inquilinos.html" class="ativo">Inquilinos</a><a
                    href="ajuda.html">Ajuda</a><a href="sair.html">Sair</a></nav>
        </aside>
        <main class="conteudo">
            <div class="cabeca">
                <h1 class="titulo">Editar Inquilino</h1>
            </div>
            <form class="cartao">
                <div class="campos">
                    <div class="cheio"><label for="nome">Nome completo</label><input id="nome" name="nome" type="text"
                            required></div>
                    <div><label for="cpf">CPF</label><input id="cpf" name="cpf" type="text" required></div>
                    <div><label for="nascimento">Data de nascimento</label><input id="nascimento" name="nascimento"
                            type="date"></div>
                    <div><label for="email">Email</label><input id="email" name="email" type="email" required></div>
                    <div><label for="telefone">Telefone</label><input id="telefone" name="telefone" type="tel"></div>
                    <div><label for="profissao">Profissão</label><input id="profissao" name="profissao" type="text">
                    </div>
                    <div><label for="situacao">Situação</label><select id="situacao" name="situacao">
                            <option>Em Dia</option>
                            <option>Pendente</option>
                        </select></div>
                    <div class="cheio"><label for="endereco">Endereço</label><input id="endereco" name="endereco"
                            type="text"></div>
                    <div><label for="imovel">Imóvel alugado</label><select id="imovel" name="imovel"></select></div>
                    <div><label for="desde">Inquilino desde</label><input id="desde" name="desde" type="text"
                            placeholder="Jan/2024"></div>
                </div>
                <div class="acoes" style="justify-content:flex-end;margin-top:20px"><a class="btn"
                        href="inquilinos.html">Cancelar</a><button class="btn btn-ouro" type="submit">Salvar</button>
                </div>
            </form>
        </main>
    </div>
    <script src="proprietario.js"></script>
</body>

</html>
