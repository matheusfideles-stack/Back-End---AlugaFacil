<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esqueci a senha | AlugaFácil</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <main class="login">
        <section class="lado-azul">
            <a class="logo" href="index.html">Aluga<span>Fácil</span></a>
            <h2>Esqueceu a senha?</h2>
            <p class="info" style="color:#cbd5e1">Sem problema. Informe seu email e enviaremos um link para você criar uma nova senha.</p>
        </section>
        <section class="lado-form">
            <div style="width:100%;max-width:340px">
                <p class="aviso" id="aviso" hidden></p>
                <form id="form-recuperar" novalidate>
                    <h1 class="titulo">Recuperar senha</h1>
                    <p class="sub">Digite o email da sua conta</p>
                    <label for="email">Email</label>
                    <input id="email" type="email" required placeholder="seuemail@gmail.com" autocomplete="email">
                    <button class="btn btn-ouro btn-cheio" type="submit" style="margin-top:16px">Enviar link</button>
                    <p class="info central" style="margin-top:12px"><a href="login.html" style="color:var(--ouro-texto)">Voltar para o login</a></p>
                </form>
            </div>
        </section>
    </main>
    <script>
        // Tela fictícia: não envia email de verdade, só mostra a confirmação
        (function () {
            var form = document.getElementById('form-recuperar');
            var email = document.getElementById('email');
            var aviso = document.getElementById('aviso');

            function mostrarAviso(mensagem, ok) {
                aviso.textContent = mensagem;
                aviso.className = 'aviso' + (ok ? ' ok' : '');
                aviso.hidden = false;
            }

            form.addEventListener('submit', function (e) {
                e.preventDefault();
                if (!email.checkValidity()) {
                    mostrarAviso('Digite um email válido, por exemplo: nome@email.com.', false);
                    email.focus();
                    return;
                }
                mostrarAviso('Se o email estiver cadastrado, você vai receber o link em instantes.', true);
            });
        })();
    </script>
</body>

</html>
