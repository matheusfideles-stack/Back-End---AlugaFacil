<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Início do Cliente | AlugaFácil</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body data-exige="LOCATARIO">
    <header class="topo">
        <div class="topo-int">
            <a class="logo" href="cliente.html">Aluga<span>Fácil</span></a>
            <nav class="menu" id="menu-principal"></nav>
            <div class="topo-acoes" id="topo-acoes"></div>
        </div>
    </header>
    <main class="container">
        <h1 class="titulo" data-saudacao>Bem-vindo ao Portal do Cliente</h1>
        <p class="aviso" id="erro" hidden></p>
        <section class="grade g3" style="margin-top:20px">
            <div class="cartao">
                <p class="rotulo">Meus Imóveis</p>
                <p class="numero" id="n-imoveis">–</p>
                <p class="info">Imóveis alugados no momento</p>
            </div>
            <div class="cartao">
                <p class="rotulo">Próximo Pagamento</p>
                <p class="numero" id="n-proximo">–</p>
                <p class="info" id="t-proximo">&nbsp;</p>
            </div>
            <div class="cartao">
                <p class="rotulo">Pendências</p>
                <p class="numero" id="n-pendencias">–</p>
                <p class="info" id="t-pendencias">&nbsp;</p>
            </div>
        </section>
        <h2 class="secao">Seus Imóveis</h2>
        <section class="grade g3" id="imoveis">
            <p class="vazio">Carregando...</p>
        </section>
    </main>
    <script src="js/api.js"></script>
    <script src="js/cliente.js"></script>
</body>

</html>
