<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financeiro | AlugaFácil</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body data-pagina="financeiro" data-exige="LOCADOR">
    <header class="topo">
        <div class="topo-int largo">
            <a class="logo" href="proprietario.html">Aluga<span>Fácil</span></a>
            <a class="info" href="proprietario.html" style="text-decoration:underline" data-saudacao="curta">Olá!</a>
        </div>
    </header>
    <div class="painel">
        <aside class="lateral">
            <p>Menu</p>
            <nav><a href="proprietario.html">Visão Geral</a><a href="meus-imoveis.html">Meus Imóveis</a><a
                    href="financeiro.html" class="ativo">Financeiro</a><a href="inquilinos.html">Inquilinos</a><a
                    href="proprietario-ajuda.html">Ajuda</a><a href="sair.html">Sair</a></nav>
        </aside>
        <main class="conteudo">
            <h1 class="titulo">Financeiro</h1>
            <p class="aviso" id="erro" hidden></p>
            <section class="grade g4" style="margin-top:20px">
                <div class="cartao">
                    <p class="rotulo">Imóveis cadastrados</p>
                    <p class="numero" style="color:var(--azul)" id="n-imoveis">–</p>
                    <p class="info" id="t-imoveis">&nbsp;</p>
                </div>
                <div class="cartao">
                    <p class="rotulo">Receita do mês</p>
                    <p class="numero" id="n-receita">–</p>
                    <span class="selo" id="t-receita">&nbsp;</span>
                </div>
                <div class="cartao">
                    <p class="rotulo">Inquilinos ativos</p>
                    <p class="numero" style="color:var(--azul)" id="n-inquilinos">–</p>
                    <p class="info" id="t-inquilinos">&nbsp;</p>
                </div>
                <div class="cartao">
                    <p class="rotulo">Pendências</p>
                    <p class="numero" style="color:var(--azul)" id="n-pendencias">–</p>
                    <span class="selo" id="t-pendencias">&nbsp;</span>
                </div>
            </section>
            <section class="cartao" style="margin-top:20px">
                <h2 class="secao" style="margin-top:0">Receitas por Mês</h2>
                <svg class="grafico" id="grafico" viewBox="0 0 660 190" role="img" aria-label="Receitas por mês"></svg>
            </section>
            <section class="cartao" style="margin-top:20px">
                <h2 class="secao" style="margin-top:0">Últimos recebimentos</h2>
                <div id="recebimentos"><p class="info">Carregando...</p></div>
            </section>
        </main>
    </div>
    <script src="js/api.js"></script>
    <script src="js/proprietario.js"></script>
</body>

</html>
