<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Imóvel | AlugaFácil</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body data-pagina="imovel-form" data-exige="LOCADOR">
    <header class="topo">
        <div class="topo-int largo">
            <a class="logo" href="proprietario.html">Aluga<span>Fácil</span></a>
            <a class="info" href="proprietario.html" style="text-decoration:underline" data-saudacao="curta">Olá!</a>
        </div>
    </header>
    <div class="painel">
        <aside class="lateral">
            <p>Menu</p>
            <nav><a href="proprietario.html">Visão Geral</a><a href="meus-imoveis.html" class="ativo">Meus Imóveis</a><a
                    href="financeiro.html">Financeiro</a><a href="inquilinos.html">Inquilinos</a><a
                    href="proprietario-ajuda.html">Ajuda</a><a href="sair.html">Sair</a></nav>
        </aside>
        <main class="conteudo" id="conteudo-form">
            <div class="cabeca">
                <h1 class="titulo" id="titulo-pagina">Editar Imóvel</h1>
            </div>
            <p class="aviso" id="erro" hidden></p>
            <form class="cartao">
                <div class="campos">
                    <div class="cheio"><label for="titulo">Título do anúncio</label><input id="titulo" name="titulo"
                            type="text" placeholder="Ex.: Casa - Bairro Alvorada" required></div>
                    <div><label for="tipo">Tipo de imóvel</label><select id="tipo" name="tipo">
                            <option value="CASA">Casa</option>
                            <option value="APARTAMENTO">Apartamento</option>
                            <option value="KITNET">Kitnet</option>
                            <option value="SALA_COMERCIAL">Sala comercial</option>
                            <option value="GALPAO">Galpão</option>
                        </select></div>
                    <div><label for="valorAluguel">Valor do aluguel (R$)</label><input id="valorAluguel"
                            name="valorAluguel" type="number" min="0.01" step="0.01" required></div>
                    <div><label for="valorCondominio">Condomínio (R$)</label><input id="valorCondominio"
                            name="valorCondominio" type="number" min="0" step="0.01" value="0"></div>
                    <div><label for="vagas">Vagas de garagem</label><input id="vagas" name="vagas" type="number"
                            min="0"></div>
                    <div><label for="cep">CEP</label><input id="cep" name="cep" type="text" placeholder="00000-000"
                            maxlength="9" required></div>
                    <div><label for="logradouro">Rua</label><input id="logradouro" name="logradouro" type="text"
                            required></div>
                    <div><label for="numero">Número</label><input id="numero" name="numero" type="text" required></div>
                    <div><label for="complemento">Complemento</label><input id="complemento" name="complemento"
                            type="text" placeholder="Apto, bloco..."></div>
                    <div><label for="bairro">Bairro</label><input id="bairro" name="bairro" type="text" required></div>
                    <div><label for="cidade">Cidade</label><select id="cidade" name="cidade" required></select></div>
                    <div><label for="uf">UF</label><input id="uf" name="uf" type="text" maxlength="2" readonly required></div>
                    <div><label for="quartos">Quartos</label><input id="quartos" name="quartos" type="number"
                            min="0"></div>
                    <div><label for="banheiros">Banheiros</label><input id="banheiros" name="banheiros" type="number"
                            min="0"></div>
                    <div class="cheio"><label for="areaM2">Área (m²)</label><input id="areaM2" name="areaM2"
                            type="number" min="0"></div>
                    <div class="cheio"><label for="descricao">Descrição</label><textarea id="descricao" name="descricao"
                            rows="4"></textarea></div>
                    <div class="cheio"><label>Comodidades <span class="info">(marque o que o imóvel oferece)</span></label>
                        <div class="comodidades-grade" id="comodidades-form"></div></div>
                    <div class="cheio" id="fotos-gerencia">
                        <label>Fotos do imóvel <span class="info">(até 10 fotos JPG, PNG ou WebP de até 5 MB; a primeira é a capa)</span></label>
                        <div class="fotos-grade" id="fotos-grade"></div>
                        <input type="file" id="fotos-arquivo" accept="image/jpeg,image/png,image/webp" multiple hidden>
                        <button type="button" class="btn" id="fotos-adicionar">+ Adicionar fotos</button>
                        <p class="aviso" id="fotos-erro" hidden style="margin-top:10px"></p>
                    </div>
                </div>
                <div class="acoes" style="justify-content:flex-end;margin-top:20px"><a class="btn"
                        href="meus-imoveis.html">Cancelar</a><button class="btn btn-ouro" type="submit">Salvar</button>
                </div>
            </form>
        </main>
    </div>
    <script src="js/api.js"></script>
    <script src="js/proprietario.js"></script>
</body>

</html>
