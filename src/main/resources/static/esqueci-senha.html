<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esqueci a senha | AlugaFácil</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <main class="login">
        <section class="lado-azul">
            <a class="logo" href="index.html">Aluga<span>Fácil</span></a>
            <h2>Esqueceu a senha?</h2>
            <p class="info" style="color:#cbd5e1">Sem problema. Informe seu email e enviaremos um código de 6 dígitos para você criar uma nova senha.</p>
        </section>
        <section class="lado-form">
            <div style="width:100%;max-width:340px">
                <p class="aviso" id="aviso" hidden></p>
                <form id="form-recuperar" novalidate>
                    <h1 class="titulo">Recuperar senha</h1>
                    <p class="sub">Digite o email da sua conta</p>
                    <label for="email">Email</label>
                    <input id="email" type="email" required placeholder="seuemail@gmail.com" autocomplete="email">
                    <button class="btn btn-ouro btn-cheio" type="submit" style="margin-top:16px">Enviar código</button>
                    <p class="info central" style="margin-top:12px"><a href="login.html" style="color:var(--ouro-texto)">Voltar para o login</a></p>
                </form>
            </div>
        </section>
    </main>
    <script src="js/api.js"></script>
    <script>
        (function () {
            var form = document.getElementById('form-recuperar');
            var email = document.getElementById('email');
            var aviso = document.getElementById('aviso');
            var botao = form.querySelector('button[type=submit]');

            form.addEventListener('submit', async function (e) {
                e.preventDefault();
                if (!email.checkValidity()) {
                    mostrarAviso(aviso, 'Digite um email válido, por exemplo: nome@email.com.');
                    email.focus();
                    return;
                }
                botao.disabled = true;
                botao.textContent = 'Enviando...';
                try {
                    var resposta = await api('/auth/esqueci-senha', { metodo: 'POST', corpo: { email: email.value.trim() }, autenticado: false });
                    try {
                        sessionStorage.setItem('recuperar-email', email.value.trim());
                        if (resposta.codigoDeTeste) sessionStorage.setItem('recuperar-codigo-teste', resposta.codigoDeTeste);
                        else sessionStorage.removeItem('recuperar-codigo-teste');
                    } catch (e) { }
                    location.href = 'redefinir-senha.html';
                    return;
                } catch (erro) {
                    mostrarAviso(aviso, erro.message);
                }
                botao.disabled = false;
                botao.textContent = 'Enviar código';
            });
        })();
    </script>
</body>

</html>
