server:
  port: 8080

spring:
  application:
    name: alugafacil
  profiles:
    active: local
  datasource:
    # Padrões para uso local; o Docker sobrescreve DB_HOST, DB_PORT, DB_NAME e DB_USER.
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:alugafacil}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USER:root}
    # Defina DB_PASSWORD no ambiente ou em application-local.yml (ignorado pelo git).
    password: ${DB_PASSWORD:}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 55MB
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: false
    locations: classpath:db/migration
    baseline-on-migrate: true
  # Para enviar e-mail de verdade defina SPRING_MAIL_HOST, SPRING_MAIL_USERNAME e SPRING_MAIL_PASSWORD.
  # Sem SMTP o codigo de verificacao e escrito no log do servidor.
  mail:
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      # Sem estes limites, um servidor de e-mail que nao responde trava o cadastro para sempre.
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

app:
  url-base: ${APP_URL_BASE:http://localhost:8080}
  email-remetente: ${MAIL_REMETENTE:nao-responda@alugafacil.local}
  email-suporte: ${MAIL_SUPORTE:suporte@alugafacil.local}
  admin:
    nome: Administrador
    email: ${ADMIN_EMAIL:}
    senha: ${ADMIN_SENHA:}
  recuperacao-senha:
    validade-minutos: 30
  confirmacao-email:
    validade-minutos: 60
  codigo:
    max-tentativas: 5
  lembretes:
    ativo: ${APP_LEMBRETES_ATIVO:true}
    cron: "0 0 9 * * *"
  geocodificacao:
    # Posicao dos imoveis no mapa, pelo Nominatim (OpenStreetMap). Use false para nao consultar a internet.
    ativa: ${APP_GEOCODIFICACAO_ATIVA:true}
  uploads:
    dir: ${UPLOADS_DIR:./uploads}

api:
  security:
    token:
      secret: ${JWT_SECRET:alugafacil-secret-trocar-em-producao}
      expiration-hours: 2

pagamento:
  gateway:
    provider: ${PAGAMENTO_PROVIDER:mercadopago}
  mercadopago:
    access-token: ${MP_ACCESS_TOKEN:}
    public-key: ${MP_PUBLIC_KEY:}
    notification-url: ${MP_NOTIFICATION_URL:}
    webhook-secret: ${MP_WEBHOOK_SECRET:}
    pix-expiracao-minutos: 1440
    boleto-dias-minimos: 3

# Por IP: requests-per-second e a vazao sustentada, burst e o pico permitido.
ratelimit:
  enabled: ${RATELIMIT_ENABLED:true}
  autenticacao:
    requests-per-second: 2
    burst: 5
  pagamentos:
    requests-per-second: 2
    burst: 5
  webhooks:
    requests-per-second: 20
    burst: 50
  contato:
    requests-per-second: 1
    burst: 3
  geral:
    requests-per-second: 10
    burst: 20

logging:
  level:
    com.larenegocios.alugafacil: INFO

springdoc:
  swagger-ui:
    path: /docs