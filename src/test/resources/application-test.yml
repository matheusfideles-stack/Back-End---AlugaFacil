spring:
  datasource:
    url: jdbc:h2:mem:alugafacil;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

app:
  # Data fixa nos testes: multa e juros nao podem depender do dia em que a suite roda.
  relogio:
    fixo-em: 2026-11-02
  lembretes:
    ativo: false
  geocodificacao:
    ativa: false
  uploads:
    dir: target/uploads-teste

api:
  security:
    token:
      secret: chave-de-teste
      expiration-hours: 2

# Folgado para os testes de integracao; os testes de rate limit sobrescrevem estes valores.
ratelimit:
  autenticacao:
    requests-per-second: 1000
    burst: 1000
  pagamentos:
    requests-per-second: 1000
    burst: 1000
  webhooks:
    requests-per-second: 1000
    burst: 1000
  contato:
    requests-per-second: 1000
    burst: 1000
  geral:
    requests-per-second: 1000
    burst: 1000

pagamento:
  gateway:
    provider: fake
