spring:
  datasource:
    url: jdbc:h2:mem:alugafacil;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

api:
  security:
    token:
      secret: chave-de-teste
      expiration-hours: 2

# Folgado para os testes de integracao; os testes de rate limit sobrescrevem estes valores.
ratelimit:
  autenticacao:
    requests-per-second: 1000
    burst: 1000
  pagamentos:
    requests-per-second: 1000
    burst: 1000
  webhooks:
    requests-per-second: 1000
    burst: 1000
  geral:
    requests-per-second: 1000
    burst: 1000

pagamento:
  gateway:
    provider: fake
